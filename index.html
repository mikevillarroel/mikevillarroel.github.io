<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MikeBuildsApp — Under Construction</title>
<meta name="description" content="MikeBuildsApp — indie iOS apps, sideloading, zero fluff. New website under construction.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0b0f;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 520px; }
  img.icon {
    width: 140px; height: 140px;
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  h1 { font-size: 2rem; margin-top: 28px; letter-spacing: -0.02em; }
  h1 .accent { color: #fdac03; }
  .tag { margin-top: 10px; color: #a1a1aa; font-size: 1.05rem; }
  .badge {
    display: inline-block;
    margin-top: 26px;
    padding: 8px 18px;
    border: 1px solid #fdac03;
    color: #fdac03;
    border-radius: 999px;
    font-weight: 600;
    font-size: .95rem;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .links { margin-top: 34px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .links a {
    color: #0b0b0f;
    background: #fdac03;
    text-decoration: none;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: .95rem;
  }
  .links a.ghost {
    background: transparent;
    color: #f5f5f7;
    border: 1px solid #3f3f46;
  }
  footer { margin-top: 40px; color: #52525b; font-size: .85rem; }

<body>
  <div class="card">

    <div class="links">
      <a href="https://t.me/MikeBuildsApp">Telegram Support</a>
      <a class="ghost" href="https://discord.gg/vjJ9rZDNsg">Discord</a>
      <a class="ghost" href="https://x.com/MikeBuildsApp">X</a>
